{% extends "base.html" %}

{% block title %}Assessment - {{ category|capitalize }}{% endblock %}

{% block content %}
<div class="row align-items-center mb-3">
    <div class="col-md-6">
        <h2>{{ category|capitalize }} Assessment</h2>
    </div>
    <div class="col-md-6 text-md-end">
        <div class="badge bg-danger fs-5" id="timer-display">15:00</div>
    </div>
</div>

<form id="assessment-form" method="POST" action="{{ url_for('assessment.submit') }}">
    <input type="hidden" name="category" value="{{ category }}">
    <input type="hidden" name="time_taken" id="time_taken" value="0">
    
    {% for q in questions %}
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-light">
            <strong>Question {{ loop.index }}:</strong> {{ q.text }}
        </div>
        <div class="card-body">
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="q_{{ q.id }}" id="q_{{ q.id }}_A" value="A">
                <label class="form-check-label" for="q_{{ q.id }}_A">{{ q.option_a }}</label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="q_{{ q.id }}" id="q_{{ q.id }}_B" value="B">
                <label class="form-check-label" for="q_{{ q.id }}_B">{{ q.option_b }}</label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="q_{{ q.id }}" id="q_{{ q.id }}_C" value="C">
                <label class="form-check-label" for="q_{{ q.id }}_C">{{ q.option_c }}</label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="q_{{ q.id }}" id="q_{{ q.id }}_D" value="D">
                <label class="form-check-label" for="q_{{ q.id }}_D">{{ q.option_d }}</label>
            </div>
        </div>
    </div>
    {% endfor %}
    
    <div class="text-center mb-5">
        <button type="button" class="btn btn-primary btn-lg px-5" onclick="submitAssessment()">Submit Assessment</button>
    </div>
</form>
{% endblock %}

{% block scripts %}
<script>
    // Timer logic - 15 minutes
    let timeRemaining = 15 * 60; 
    let initialTime = timeRemaining;
    const timerDisplay = document.getElementById('timer-display');
    const timeTakenInput = document.getElementById('time_taken');
    const form = document.getElementById('assessment-form');
    
    function updateTimer() {
        const minutes = Math.floor(timeRemaining / 60);
        let seconds = timeRemaining % 60;
        if (seconds < 10) seconds = '0' + seconds;
        
        timerDisplay.innerText = `${minutes}:${seconds}`;
        
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            alert("Time is up! Submitting your assessment.");
            submitAssessment();
        } else {
            timeRemaining--;
        }
    }
    
    function submitAssessment() {
        // Calculate time taken
        timeTakenInput.value = initialTime - timeRemaining;
        form.submit();
    }
    
    const timerInterval = setInterval(updateTimer, 1000);
</script>
{% endblock %}
