{% extends "base.html" %}
{% block title %}403 - Forbidden{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-1 fw-bold text-warning mb-4">403</h1>
            <h3 class="mb-4">Access Denied</h3>
            <p class="text-muted mb-5">You do not have permission to access this page.</p>
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary px-4 py-2 fw-bold">Go to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
