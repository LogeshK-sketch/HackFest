{% extends "base.html" %}
{% block title %}500 - Internal Server Error{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-1 fw-bold text-danger mb-4">500</h1>
            <h3 class="mb-4">Internal Server Error</h3>
            <p class="text-muted mb-5">Something went wrong on our end. We're working on fixing it. Please try again later.</p>
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary px-4 py-2 fw-bold">Go to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
